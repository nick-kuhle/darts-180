name: Bug report
description: Report a reproducible Darts 180 product, scoring, sync, or camera issue.
title: 'bug: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach room video, faces, account tokens, or private diagnostics here. For a privacy
        or security concern, follow SECURITY.md instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Game rules,
          Camera setup,
          Vision proposal,
          DartCard correction,
          Offline/sync,
          API,
          Accessibility,
          Other,
        ]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a 501 game with ...
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App/build/model/device/OS version(s)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include raw room video, faces, tokens, or personal data.
          required: true
