services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: darts180
      POSTGRES_PASSWORD: darts180
      POSTGRES_DB: darts180
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darts180 -d darts180']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-darts180
      MINIO_ROOT_PASSWORD: local-darts180-change-before-sharing
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
